name: Build BrushFeel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract BrushFeel ZIP
        run: |
          mkdir build_project
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -q "$ZIP" -d build_project
          INNER=$(find build_project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -r "$INNER"/. ./ 

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrushFeel-APK
          path: app/build/outputs/apk/debug/*.apk
