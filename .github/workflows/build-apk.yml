name: Build BrushFeel
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Buat proyek
        run: |
          mkdir -p app/src/main/java/com/brushfeel/app
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          if [ -f scratch.wav ]; then cp scratch.wav app/src/main/res/raw/scratch.wav; fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BrushFeel"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.brushfeel.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.brushfeel.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 7
                  versionName '0.7'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E1B2E"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:rotation="45"
                  android:pivotX="54"
                  android:pivotY="54">
                  <path
                      android:fillColor="#F9A8D4"
                      android:pathData="M48,22h12v6h-12z"/>
                  <path
                      android:fillColor="#CBD5E1"
                      android:pathData="M48,28h12v4h-12z"/>
                  <path
                      android:fillColor="#FBBF24"
                      android:pathData="M48,32h12v36h-12z"/>
                  <path
                      android:fillColor="#E8C9A0"
                      android:pathData="M48,68h12l-6,14z"/>
                  <path
                      android:fillColor="#374151"
                      android:pathData="M51.6,76.4h4.8l-2.4,5.6z"/>
              </group>
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:pathData="M30,84C36,79 40,89 47,84S58,79 66,84"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="BrushFeel"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".SoundService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="com.brushfeel.app.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/brushfeel/app/MainActivity.java <<'EOF'
          package com.brushfeel.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import java.util.function.IntConsumer;
          import rikka.shizuku.Shizuku;

          public class MainActivity extends Activity {
              private static final int BG = 0xFF14121F;
              private static final int CARD = 0xFF1F1C2E;
              private static final int TEXT = 0xFFF1F5F9;
              private static final int MUTED = 0xFF94A3B8;
              private static final int ACCENT = 0xFF38BDF8;
              private static final int AMBER = 0xFFFBBF24;
              private static final int TRACK = 0xFF3B3652;

              private TextView msg;
              private TextView info;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Shizuku.OnRequestPermissionResultListener permListener =
                  (requestCode, grantResult) -> runOnUiThread(() -> {
                      if (grantResult == PackageManager.PERMISSION_GRANTED) {
                          startSound();
                      } else {
                          msg.setText("Izin Shizuku ditolak. Ketuk MULAI lagi lalu pilih Izinkan.");
                      }
                  });

              private final Runnable tick = new Runnable() {
                  @Override public void run() {
                      info.setText(SoundService.status
                          + "\nSentuhan terbaca: " + SoundService.events
                          + "\nRekaman scratch.wav: "
                          + (SoundService.sampleOk ? "terbaca" : "belum terbaca (ketuk MULAI dulu)"));
                      handler.postDelayed(this, 500);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable shape(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private TextView text(String s, int sp, int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  return t;
              }

              private TextView heading(String s) {
                  TextView t = text(s, 15, AMBER);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private LinearLayout card() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(16), dp(14), dp(16), dp(14));
                  c.setBackground(shape(CARD, 18));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.topMargin = dp(12);
                  c.setLayoutParams(lp);
                  return c;
              }

              private Button button(String label, int bg, int fg, boolean outline) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(fg);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable g = shape(outline ? 0x00000000 : bg, 14);
                  if (outline) g.setStroke(dp(2), MUTED);
                  b.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(52));
                  lp.topMargin = dp(12);
                  b.setLayoutParams(lp);
                  return b;
              }

              private void slider(LinearLayout box, String label, int init, final IntConsumer onChange) {
                  TextView t = text(label, 13, MUTED);
                  t.setPadding(0, dp(10), 0, 0);
                  SeekBar s = new SeekBar(this);
                  s.setMax(100);
                  s.setProgress(init);
                  s.setProgressTintList(ColorStateList.valueOf(ACCENT));
                  s.setThumbTintList(ColorStateList.valueOf(ACCENT));
                  s.setProgressBackgroundTintList(ColorStateList.valueOf(TRACK));
                  s.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean u) {
                          onChange.accept(p);
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) { }
                      @Override public void onStopTrackingTouch(SeekBar sb) { }
                  });
                  box.addView(t);
                  box.addView(s);
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final SharedPreferences sp = getSharedPreferences("bf", MODE_PRIVATE);
                  int vol = sp.getInt("vol", 70);
                  int type = sp.getInt("type", 4);
                  if (type < 0 || type > 4) type = 4;
                  int grit = sp.getInt("grit", 35);
                  int pitch = sp.getInt("pitch", 30);
                  int dens = sp.getInt("dens", 40);
                  int rpitch = sp.getInt("rpitch", 50);
                  SoundService.volume = vol / 100f;
                  SoundService.soundType = type;
                  SoundService.grit = grit / 100f;
                  SoundService.pitch = pitch / 100f;
                  SoundService.dens = dens / 100f;
                  SoundService.rpitch = rpitch / 100f;

                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  root.setPadding(dp(20), dp(24), dp(20), dp(28));

                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  ImageView iv = new ImageView(this);
                  iv.setImageResource(R.drawable.ic_fg);
                  iv.setBackground(shape(0xFF1E1B2E, 18));
                  iv.setLayoutParams(new LinearLayout.LayoutParams(dp(64), dp(64)));
                  LinearLayout titles = new LinearLayout(this);
                  titles.setOrientation(LinearLayout.VERTICAL);
                  titles.setPadding(dp(14), 0, 0, 0);
                  TextView title = text("BrushFeel", 26, TEXT);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  titles.addView(title);
                  titles.addView(text("Suara goresan untuk ibisPaint", 13, MUTED));
                  head.addView(iv);
                  head.addView(titles);
                  root.addView(head);

                  LinearLayout statusCard = card();
                  msg = text("Siap. Ketuk MULAI SUARA.", 16, TEXT);
                  info = text("", 13, MUTED);
                  info.setPadding(0, dp(8), 0, 0);
                  statusCard.addView(msg);
                  statusCard.addView(info);
                  root.addView(statusCard);

                  Button start = button("Mulai suara", ACCENT, 0xFF0B1220, false);
                  start.setOnClickListener(v -> startSound());
                  Button stop = button("Berhenti", 0, TEXT, true);
                  stop.setOnClickListener(v -> {
                      stopService(new Intent(this, SoundService.class));
                      msg.setText("Suara dihentikan.");
                  });
                  root.addView(start);
                  root.addView(stop);

                  LinearLayout typeCard = card();
                  typeCard.addView(heading("Jenis suara"));
                  RadioGroup rg = new RadioGroup(this);
                  String[] names = {"Pensil", "Pensil halus", "Kuas basah",
                      "Pensil kertas (berbutir)", "Pensil rekaman (dari klip)"};
                  for (int i = 0; i < names.length; i++) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(names[i]);
                      rb.setTextColor(TEXT);
                      rb.setButtonTintList(ColorStateList.valueOf(ACCENT));
                      rb.setPadding(dp(6), dp(8), dp(6), dp(8));
                      rb.setId(100 + i);
                      rg.addView(rb);
                  }
                  rg.check(100 + type);
                  rg.setOnCheckedChangeListener((g, id) -> {
                      int t = id - 100;
                      SoundService.soundType = t;
                      sp.edit().putInt("type", t).apply();
                  });
                  typeCard.addView(rg);
                  root.addView(typeCard);

                  LinearLayout volCard = card();
                  volCard.addView(heading("Volume"));
                  slider(volCard, "Volume suara goresan", vol, p -> {
                      SoundService.volume = p / 100f;
                      sp.edit().putInt("vol", p).apply();
                  });
                  root.addView(volCard);

                  LinearLayout advCard = card();
                  final TextView advHead = heading("Setelan lanjutan  +");
                  final LinearLayout adv = new LinearLayout(this);
                  adv.setOrientation(LinearLayout.VERTICAL);
                  adv.setVisibility(View.GONE);
                  advHead.setOnClickListener(v -> {
                      boolean open = adv.getVisibility() == View.VISIBLE;
                      adv.setVisibility(open ? View.GONE : View.VISIBLE);
                      advHead.setText(open ? "Setelan lanjutan  +" : "Setelan lanjutan  -");
                  });
                  adv.addView(text("Pensil rekaman", 14, TEXT));
                  slider(adv, "Nada rekaman (kiri rendah, tengah asli, kanan tinggi)", rpitch, p -> {
                      SoundService.rpitch = p / 100f;
                      sp.edit().putInt("rpitch", p).apply();
                  });
                  TextView kertas = text("Pensil kertas", 14, TEXT);
                  kertas.setPadding(0, dp(16), 0, 0);
                  adv.addView(kertas);
                  slider(adv, "Kekasaran (kiri halus, kanan kasar)", grit, p -> {
                      SoundService.grit = p / 100f;
                      sp.edit().putInt("grit", p).apply();
                  });
                  slider(adv, "Nada (kiri rendah, kanan tinggi)", pitch, p -> {
                      SoundService.pitch = p / 100f;
                      sp.edit().putInt("pitch", p).apply();
                  });
                  slider(adv, "Kerapatan butir (kiri jarang, kanan rapat)", dens, p -> {
                      SoundService.dens = p / 100f;
                      sp.edit().putInt("dens", p).apply();
                  });
                  advCard.addView(advHead);
                  advCard.addView(adv);
                  root.addView(advCard);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  sv.addView(root);
                  setContentView(sv);

                  Shizuku.addRequestPermissionResultListener(permListener);
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
              }

              private void startSound() {
                  if (!Shizuku.pingBinder()) {
                      msg.setText("Shizuku belum jalan. Buka Shizuku lalu ketuk Start.");
                      return;
                  }
                  if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                      msg.setText("Izinkan BrushFeel di jendela Shizuku yang muncul.");
                      Shizuku.requestPermission(100);
                      return;
                  }
                  startForegroundService(new Intent(this, SoundService.class));
                  msg.setText("Suara AKTIF. Buka ibisPaint lalu menggambar.");
              }

              @Override protected void onResume() {
                  super.onResume();
                  handler.post(tick);
              }

              @Override protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(tick);
              }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  Shizuku.removeRequestPermissionResultListener(permListener);
              }
          }
          EOF
          cat > app/src/main/java/com/brushfeel/app/SoundService.java <<'EOF'
          package com.brushfeel.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioTrack;
          import android.os.IBinder;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import java.util.Random;
          import rikka.shizuku.Shizuku;

          public class SoundService extends Service {
              public static volatile float volume = 0.7f;
              public static volatile int soundType = 4;
              public static volatile float grit = 0.35f;
              public static volatile float pitch = 0.3f;
              public static volatile float dens = 0.4f;
              public static volatile float rpitch = 0.5f;
              public static volatile boolean sampleOk = false;
              public static volatile String status = "Belum jalan";
              public static volatile long events = 0;

              private volatile boolean running = false;
              private volatile Process proc;
              private Thread audioThread;
              private Thread touchThread;

              private volatile long lastMoveNs = 0;
              private volatile float level = 0f;
              private volatile int tekCount = 0;

              private final int[] px = new int[10];
              private final int[] py = new int[10];
              private int cur = 0;
              private float dxAcc = 0, dyAcc = 0;
              private long lastSyncNs = 0;
              private float smooth = 0f;
              private float peak = 1f;
              private boolean fresh = true;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(
                      new NotificationChannel("bf", "BrushFeel", NotificationManager.IMPORTANCE_LOW));
                  Notification n = new Notification.Builder(this, "bf")
                      .setContentTitle("BrushFeel aktif")
                      .setContentText("Suara goresan menyala")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build();
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);

                  if (!running) {
                      running = true;
                      events = 0;
                      for (int k = 0; k < 10; k++) { px[k] = -1; py[k] = -1; }
                      audioThread = new Thread(this::audioLoop, "bf-audio");
                      touchThread = new Thread(this::touchLoop, "bf-touch");
                      audioThread.start();
                      touchThread.start();
                  }
                  return START_NOT_STICKY;
              }

              @Override public void onDestroy() {
                  running = false;
                  status = "Berhenti";
                  try {
                      Process p = proc;
                      if (p != null) p.destroy();
                  } catch (Throwable ignored) { }
                  super.onDestroy();
              }

              private float[] loadSample() {
                  try {
                      int id = getResources().getIdentifier("scratch", "raw", getPackageName());
                      if (id == 0) return null;
                      InputStream in = getResources().openRawResource(id);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] tmp = new byte[8192];
                      int r;
                      while ((r = in.read(tmp)) > 0) bo.write(tmp, 0, r);
                      in.close();
                      byte[] d = bo.toByteArray();
                      int n = (d.length - 44) / 2;
                      if (n <= 0) return null;
                      float[] f = new float[n];
                      for (int i = 0; i < n; i++) {
                          int lo = d[44 + 2 * i] & 0xff;
                          int hi = d[45 + 2 * i];
                          f[i] = ((short) ((hi << 8) | lo)) / 32768f;
                      }
                      return f;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private void touchLoop() {
                  while (running) {
                      try {
                          Method m = Shizuku.class.getDeclaredMethod(
                              "newProcess", String[].class, String[].class, String.class);
                          m.setAccessible(true);
                          proc = (Process) m.invoke(null,
                              new String[]{"sh", "-c", "exec getevent"}, null, null);
                          status = "Mendengarkan sentuhan layar...";
                          BufferedReader r = new BufferedReader(
                              new InputStreamReader(proc.getInputStream()));
                          String line;
                          while (running && (line = r.readLine()) != null) {
                              handle(line);
                          }
                      } catch (Throwable t) {
                          status = "Eror: " + t;
                      }
                      try {
                          Process p = proc;
                          if (p != null) p.destroy();
                      } catch (Throwable ignored) { }
                      if (running) {
                          try { Thread.sleep(1000); } catch (InterruptedException e) { return; }
                      }
                  }
              }

              private void handle(String line) {
                  if (!line.startsWith("/dev/")) return;
                  int c = line.indexOf(':');
                  if (c < 0) return;
                  String[] p = line.substring(c + 1).trim().split("\\s+");
                  if (p.length < 3) return;
                  int type, code;
                  long val;
                  try {
                      type = Integer.parseInt(p[0], 16);
                      code = Integer.parseInt(p[1], 16);
                      val = Long.parseLong(p[2], 16);
                  } catch (NumberFormatException e) {
                      return;
                  }
                  if (type == 3) {
                      if (code == 0x2f) {
                          cur = (int) Math.min(Math.max(val, 0), 9);
                      } else if (code == 0x39) {
                          if (val == 0xffffffffL) {
                              lift();
                          } else {
                              px[cur] = -1;
                              py[cur] = -1;
                              fresh = true;
                          }
                      } else if (code == 0x35) {
                          events++;
                          if (px[cur] >= 0) dxAcc += val - px[cur];
                          px[cur] = (int) val;
                      } else if (code == 0x36) {
                          events++;
                          if (py[cur] >= 0) dyAcc += val - py[cur];
                          py[cur] = (int) val;
                      }
                  } else if (type == 1 && code == 0x14a && val == 0) {
                      lift();
                  } else if (type == 1 && code == 0x14a && val == 1) {
                      fresh = true;
                  } else if (type == 0 && code == 0) {
                      sync();
                  }
              }

              private void lift() {
                  px[cur] = -1;
                  py[cur] = -1;
                  dxAcc = 0;
                  dyAcc = 0;
                  smooth = 0f;
                  lastMoveNs = 0;
                  fresh = true;
              }

              private void sync() {
                  long now = System.nanoTime();
                  float dist = (float) Math.hypot(dxAcc, dyAcc);
                  dxAcc = 0;
                  dyAcc = 0;
                  float dtMs = (now - lastSyncNs) / 1e6f;
                  lastSyncNs = now;
                  if (dist >= 2f && dtMs > 0.5f) {
                      if (dtMs > 50f) dtMs = 50f;
                      float inst = dist / dtMs;
                      smooth = smooth * 0.6f + inst * 0.4f;
                      peak = Math.max(peak * 0.9995f, smooth);
                      float ratio = Math.min(1f, smooth / (peak * 0.7f));
                      level = Math.min(1f, 0.15f + 0.85f * (float) Math.sqrt(ratio));
                      if (fresh) {
                          fresh = false;
                          tekCount = tekCount + 1;
                      }
                      lastMoveNs = now;
                  }
              }

              private void audioLoop() {
                  final int sr = 44100;
                  final int chunk = 256;
                  final float phInc = (float) (2.0 * Math.PI * 200.0 / sr);
                  final float[] smp = loadSample();
                  final int slen = smp == null ? 0 : smp.length;
                  sampleOk = slen > 0;
                  int minBuf = AudioTrack.getMinBufferSize(sr,
                      AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                  AudioTrack track = new AudioTrack.Builder()
                      .setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_GAME)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build())
                      .setAudioFormat(new AudioFormat.Builder()
                          .setSampleRate(sr)
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                          .build())
                      .setBufferSizeInBytes(Math.max(minBuf, chunk * 4))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                      .build();
                  track.play();

                  Random rnd = new Random();
                  short[] buf = new short[chunk];
                  float env = 0f, lp = 0f, lpA = 0f, lpB = 0f, tex = 0f;
                  float grain = 0f, bl = 0f, bm = 0f;
                  float tek = 0f, tkA = 0f, tkB = 0f, ph = 0f;
                  double pos = 0.0;
                  int lastTek = tekCount;
                  while (running) {
                      long now = System.nanoTime();
                      boolean moving = lastMoveNs != 0 && (now - lastMoveNs) < 70_000_000L;
                      float target = moving ? level : 0f;
                      float vol = volume;
                      int type = soundType;
                      float gr = grit;
                      float de = dens;
                      float la = 0.04f + 0.2f * pitch;
                      float lnorm = 1f / (0.408f * (float) Math.sqrt(la));
                      float rb = 0.6f + 0.8f * rpitch;
                      int tc = tekCount;
                      if (tc != lastTek) {
                          lastTek = tc;
                          tek = 1f;
                          if (slen > 0) pos = rnd.nextDouble() * slen;
                      }
                      float atk = 0.01f;
                      float rel = 0.003f;
                      float clickG = 1.0f;
                      float thumpG = 0.3f;
                      if (type == 1) {
                          clickG = 0.6f;
                          thumpG = 0.15f;
                      } else if (type == 2) {
                          atk = 0.005f;
                          rel = 0.0015f;
                          clickG = 0f;
                          thumpG = 0.3f;
                      }
                      for (int i = 0; i < chunk; i++) {
                          env += (target - env) * (target > env ? atk : rel);
                          float n = rnd.nextFloat() * 2f - 1f;
                          float r2 = rnd.nextFloat() * 2f - 1f;
                          float s;
                          if (type == 4) {
                              if (slen > 0) {
                                  float rt = rb * (0.9f + 0.2f * env);
                                  int i0 = (int) pos;
                                  int i1 = i0 + 1;
                                  if (i1 >= slen) i1 = 0;
                                  float fr = (float) (pos - i0);
                                  float v = smp[i0] + (smp[i1] - smp[i0]) * fr;
                                  pos += rt;
                                  if (pos >= slen) pos -= slen;
                                  s = v * env * vol * 2.0f;
                              } else {
                                  s = 0f;
                              }
                          } else if (type == 3) {
                              float rate = 400f + 5000f * de * env;
                              if (rnd.nextFloat() < rate / sr) {
                                  grain += 0.3f + 0.7f * rnd.nextFloat();
                              }
                              grain *= 0.985f;
                              bl += la * (n - bl);
                              bm += 0.35f * (r2 - bm);
                              float body = bl * lnorm * 0.131f + bm * (0.8f * gr);
                              s = body * (0.25f + 0.5f * gr * grain) * env * vol * 2.6f;
                          } else if (type == 1) {
                              lp += 0.45f * (n - lp);
                              float hp = n - lp;
                              tex += 0.01f * (r2 - tex);
                              float mod = 0.7f + 6f * Math.abs(tex);
                              s = hp * mod * env * vol * 0.8f;
                          } else if (type == 2) {
                              lpA += 0.25f * (n - lpA);
                              lpB += 0.03f * (n - lpB);
                              float band = lpA - lpB;
                              tex += 0.002f * (r2 - tex);
                              float mod = 0.55f + 18f * Math.abs(tex);
                              s = band * mod * env * vol * 2.0f;
                          } else {
                              lp += 0.2f * (n - lp);
                              float hp = n - lp;
                              tex += 0.01f * (r2 - tex);
                              float mod = 0.5f + 12f * Math.abs(tex);
                              s = hp * mod * env * vol * 0.9f;
                          }
                          if (tek > 0.001f) {
                              float tn = rnd.nextFloat() * 2f - 1f;
                              tkA += 0.3f * (tn - tkA);
                              tkB += 0.04f * (tn - tkB);
                              float click = (tkA - tkB) * 3f;
                              ph += phInc;
                              if (ph > 6.2831855f) ph -= 6.2831855f;
                              float thump = (float) Math.sin(ph);
                              s += tek * (click * clickG + thump * thumpG) * vol;
                              tek *= 0.997f;
                          }
                          if (s > 1f) s = 1f;
                          if (s < -1f) s = -1f;
                          buf[i] = (short) (s * 32767f);
                      }
                      track.write(buf, 0, chunk);
                  }
                  track.stop();
                  track.release();
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BrushFeel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
